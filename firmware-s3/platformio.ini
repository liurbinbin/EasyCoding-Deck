[platformio]
default_envs = t_keyboard_voice

[env:t_keyboard_voice]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = t_keyboard_voice_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    lovyan03/LovyanGFX @ 1.3.0
    https://github.com/lewisxhe/SensorLib.git#2b9e591f245e447d3d00ec8798c3f49b897882d9
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSENSORLIB_EXCLUDE_ALL=1
    -DSENSORLIB_EXCLUDE_PMIC=0
    -DSENSORLIB_EXCLUDE_PMIC_AXP2101=0

